<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — TECH ACCESS</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">

<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .error-code {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(6rem, 20vw, 10rem);
    color: var(--accent);
    line-height: 1;
    letter-spacing: 4px;
  }
  .error-title {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    letter-spacing: 2px;
    margin: 10px 0 16px;
  }
  .error-text {
    color: var(--mid);
    max-width: 420px;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .error-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .error-actions a {
    font-family: "Space Mono", monospace;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    transition: opacity 0.2s;
  }
  .error-actions a:hover { opacity: 0.85; }
  .error-actions .primary { background: var(--accent); color: var(--white); }
  .error-actions .secondary { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--white); }
</style>
</head>
<body style="background: var(--black); color: var(--white);">

  <div class="error-page">
    <img src="assets/logo-header.jpeg" alt="TECH ACCESS" style="width:64px; height:64px; border-radius:50%; object-fit:cover; margin-bottom:24px;">
    <div class="error-code">404</div>
    <div class="error-title">PAGE INTROUVABLE</div>
    <p class="error-text">
      La page que tu cherches n'existe pas ou plus. Elle a peut-être été déplacée, ou le lien est incorrect.
    </p>
    <div class="error-actions">
      <a href="index.html" class="primary">🏠 Retour à l'accueil</a>
      <a href="contact.html" class="secondary">✉️ Nous contacter</a>
    </div>
  </div>

</body>
</html>
